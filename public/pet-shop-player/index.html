<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | SampleProject</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #9fd49a; }
      #unity-canvas { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
    <script src="Build/pet-shop-player.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      canvas.style.width = "100%";
      canvas.style.height = "100%";

      var latestOcrMessage = null;
      var unityInstanceRef = null;

      function deliverLatestOcrMessage() {
        if (!unityInstanceRef || !latestOcrMessage) {
          return;
        }

        try {
          unityInstanceRef.SendMessage(
            "PetFarm",
            "OnParentMessage",
            JSON.stringify(latestOcrMessage)
          );
          var active = (latestOcrMessage.pets || []).filter(function (p) { return p && p.active; }).length;
          console.log("[OCR Unity bridge] delivered subscriptions:", active, "active pet(s)");
        } catch (err) {
          console.error("[OCR Unity bridge] failed to deliver parent message", err);
        }
      }

      window.addEventListener("message", function (event) {
        if (!event.data || event.data.type !== "ocr:subscriptions") {
          return;
        }

        latestOcrMessage = event.data;
        deliverLatestOcrMessage();
      });

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/pet-shop-player.data.br",
        frameworkUrl: "Build/pet-shop-player.framework.js.br",
        codeUrl: "Build/pet-shop-player.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "SampleProject",
        productVersion: "0.1.0",
      }).then(function (unityInstance) {
        unityInstanceRef = unityInstance;
        deliverLatestOcrMessage();
        window.parent.postMessage({ type: "ocr:unity-ready" }, "*");
      }).catch(function (message) {
        alert(message);
      });
    </script>
  </body>
</html>
