<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OCR Farm</title>
    <style>
      :root {
        font-family:
          'SF Pro Rounded',
          'Nunito',
          system-ui,
          -apple-system,
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background: #9fd49a;
      }

      .sky {
        position: absolute;
        inset: 0 0 46% 0;
        background: linear-gradient(180deg, #b8e8ff 0%, #e8f6ff 55%, #dff5e8 100%);
      }

      .sun {
        position: absolute;
        top: 10%;
        right: 14%;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #fff6c8, #ffd86b 55%, #ffb703);
        box-shadow: 0 0 48px rgba(255, 216, 107, 0.65);
      }

      .cloud {
        position: absolute;
        background: rgba(255, 255, 255, 0.88);
        border-radius: 999px;
        filter: blur(0.2px);
        opacity: 0.9;
      }

      .cloud-a {
        top: 14%;
        left: 10%;
        width: 88px;
        height: 34px;
      }

      .cloud-b {
        top: 22%;
        left: 42%;
        width: 110px;
        height: 38px;
        opacity: 0.75;
      }

      .ground {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 52%;
        background-color: #8fd18b;
        background-image:
          linear-gradient(90deg, rgba(255, 255, 255, 0.08) 50%, transparent 50%),
          linear-gradient(rgba(255, 255, 255, 0.08) 50%, transparent 50%);
        background-size: 48px 48px;
        box-shadow: inset 0 24px 40px rgba(255, 255, 255, 0.12);
      }

      .fence {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 46%;
        height: 24px;
        background: repeating-linear-gradient(90deg, #a47148 0 10px, transparent 10px 26px);
        opacity: 0.45;
      }

      .barn {
        position: absolute;
        left: 7%;
        bottom: 30%;
        width: 108px;
        height: 82px;
        background: linear-gradient(180deg, #e63946, #c1121f);
        border-radius: 6px 6px 0 0;
        box-shadow: 0 16px 30px rgba(0, 0, 0, 0.12);
      }

      .barn::before {
        content: '';
        position: absolute;
        left: 50%;
        top: -32px;
        transform: translateX(-50%);
        border-left: 58px solid transparent;
        border-right: 58px solid transparent;
        border-bottom: 36px solid #9d0208;
      }

      .hud {
        position: relative;
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 14px 18px;
        color: #1b4332;
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.95);
        box-shadow: 0 8px 24px rgba(27, 46, 31, 0.06);
      }

      .hud strong {
        font-size: 1rem;
        letter-spacing: -0.02em;
      }

      .hud span {
        font-size: 0.8rem;
        font-weight: 600;
        color: #5c7362;
      }

      .pasture {
        position: absolute;
        inset: 58px 0 0 0;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: clamp(1rem, 5vw, 2.5rem);
        padding: 0 1rem 20%;
      }

      .pet {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        transform: translateY(32px) scale(0.88);
        opacity: 0;
        transition:
          transform 0.5s cubic-bezier(0.34, 1.4, 0.64, 1),
          opacity 0.4s ease;
      }

      .pet.active {
        transform: translateY(0) scale(1);
        opacity: 1;
        animation: hop 2.8s ease-in-out infinite;
      }

      .pet-emoji {
        font-size: clamp(3.5rem, 10vw, 5.5rem);
        filter: drop-shadow(0 16px 24px rgba(27, 46, 31, 0.18));
      }

      .pet-label {
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: #1b4332;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 8px 20px rgba(27, 46, 31, 0.1);
      }

      .empty {
        position: absolute;
        inset: 58px 0 0 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        text-align: center;
        color: #1b4332;
      }

      .empty-card {
        max-width: 320px;
        padding: 28px 24px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 20px 40px rgba(27, 46, 31, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.95);
      }

      .empty-card strong {
        display: block;
        font-size: 1.15rem;
        margin-bottom: 8px;
      }

      .empty-card p {
        margin: 0;
        line-height: 1.55;
        color: #5c7362;
        font-size: 0.95rem;
      }

      @keyframes hop {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-10px) scale(1.03);
        }
      }
    </style>
  </head>
  <body>
    <div class="sky"></div>
    <div class="cloud cloud-a"></div>
    <div class="cloud cloud-b"></div>
    <div class="sun"></div>
    <div class="fence"></div>
    <div class="barn"></div>
    <div class="ground"></div>

    <div class="hud">
      <strong>Your farm</strong>
      <span id="wallet">Connect wallet in the shop</span>
    </div>

    <div class="pasture" id="pasture" hidden></div>
    <div class="empty" id="empty">
      <div class="empty-card">
        <strong>No pets yet</strong>
        <p>Adopt an animal in Creators Hub. Active subscriptions hop into your farm until they expire.</p>
      </div>
    </div>

    <script>
      const pasture = document.getElementById('pasture')
      const empty = document.getElementById('empty')
      const walletEl = document.getElementById('wallet')

      function render(message) {
        const pets = message?.pets ?? []
        const active = pets.filter((pet) => pet.active)

        walletEl.textContent = message?.wallet
          ? `${message.wallet.slice(0, 6)}…${message.wallet.slice(-4)}`
          : 'Connect wallet in the shop'

        pasture.innerHTML = ''
        if (active.length === 0) {
          pasture.hidden = true
          empty.hidden = false
          return
        }

        empty.hidden = true
        pasture.hidden = false

        for (const pet of active) {
          const node = document.createElement('div')
          node.className = 'pet active'
          node.innerHTML = `<div class="pet-emoji">${pet.emoji}</div><div class="pet-label">${pet.name}</div>`
          pasture.appendChild(node)
        }
      }

      window.addEventListener('message', (event) => {
        if (!event.data || event.data.type !== 'ocr:subscriptions') return
        render(event.data)
      })
    </script>
  </body>
</html>
